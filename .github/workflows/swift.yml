# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift Build and Test
on:
  push:
  pull_request:

jobs:
  macos-build:
    name: Swift ${{ matrix.swift-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26]
        swift-version: ["6.4.1"]
    steps:
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift-version }}
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete -Xcxx -xobjective-c++ -v
      - name: Run tests
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xcxx -xobjective-c++ -v
  ubuntu-build:
    name: Swift ${{ matrix.swift-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        swift-version: ["6.4.1"]
    steps:
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift-version }}
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download pre-built llama.cpp binaries
        run: |
          wget -O llama-cpp-bin.zip "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-ubuntu-x64.zip"
          unzip llama-cpp-bin.zip -d llama-cpp-bin
      - name: Copy llama.cpp binaries
        run: cp llama-cpp-bin/build/bin/lib*.so ./
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete -Xlinker -L./ -v
      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          swift test -c release -Xswiftc -strict-concurrency=complete -Xlinker -L./ -v
  windows-build:
    name: Swift ${{ matrix.swift-version.tag }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        swift-version:
          [{
            branch: "swift-6.4.1-release",
            tag: "6.4.1-RELEASE"
          }]
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: ${{ matrix.swift-version.branch }}
          swift-build: ${{ matrix.swift-version.tag }}
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download pre-built llama.cpp binaries
        shell: pwsh
        run: |
          $zipUrl = "https://github.com/fkunn1326/llama.cpp/releases/download/b4846/llama-b4846-bin-win-avx-x64.zip"
          $zipPath = "llama-cpp-bin.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath llama-cpp-bin
      - name: Copy llama.cpp binaries
        shell: pwsh
        run: |
          Copy-Item -Path "llama-cpp-bin/llama.dll" -Destination "./"
          Copy-Item -Path "llama-cpp-bin/llama.lib" -Destination "./"
          Copy-Item -Path "llama-cpp-bin/ggml.dll" -Destination "./"
          Copy-Item -Path "llama-cpp-bin/ggml-*.dll" -Destination "./"
      # Swift Build currently fails to touch resource bundles on Windows (file lock).
      - name: Build
        run: swift build --build-system native -Xswiftc -strict-concurrency=complete -v
      - name: Run tests
        run: swift test --build-system native -c release -Xswiftc -strict-concurrency=complete -v
  android-build:
    name: Swift on android
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armv7]
    env:
      SWIFT_VERSION: "6.4.2"
      ANDROID_API_LEVEL: "28"
      ANDROID_NDK_VERSION: "30.0.16248370"

    steps:
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Set up the official Swift SDK for Android
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -d "$ndk" ]]; then
            sdkmanager "ndk;$ANDROID_NDK_VERSION"
          fi
          export ANDROID_NDK_HOME="$ndk"
          export ANDROID_NDK_ROOT="$ndk"

          sdk_name="swift-${SWIFT_VERSION}-RELEASE_android"
          sdk_url="https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/swift-${SWIFT_VERSION}-RELEASE/${sdk_name}.artifactbundle.tar.gz"
          swift sdk install "$sdk_url" --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
          sdk_dir="$HOME/.config/swiftpm/swift-sdks/${sdk_name}.artifactbundle/swift-android"
          bash "$sdk_dir/scripts/setup-android-sdk.sh"

          {
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
            echo "ANDROID_SWIFT_SDK=$sdk_dir"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build
        env:
          ANDROID_ARCH: ${{ matrix.arch }}
        run: |
          target="${ANDROID_ARCH}-unknown-linux-android${ANDROID_API_LEVEL}"
          # Keep the SwiftPM XCTest executable and resource bundle layout used by the emulator.
          build_options=(--build-system native --build-tests --swift-sdk "$target")
          swift build "${build_options[@]}"
          build_dir=$(swift build "${build_options[@]}" --show-bin-path)
          echo "ANDROID_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Prepare Android emulator
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          test_bundle="$RUNNER_TEMP/azkkc-tests"
          mkdir -p "$test_bundle"
          cp "$ANDROID_BUILD_DIR/AzooKeyKanaKanjiConverterPackageTests.xctest" "$test_bundle/"
          cp -R "$ANDROID_BUILD_DIR/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleTests.resources" "$test_bundle/"
          cp -R "$ANDROID_BUILD_DIR/AzooKeyKanaKanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.resources" "$test_bundle/"
          cp "$ANDROID_SWIFT_SDK"/swift-resources/usr/lib/swift-x86_64/android/lib*.so "$test_bundle/"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$test_bundle/"

          cat > "$RUNNER_TEMP/run-android-tests.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          adb push "$RUNNER_TEMP/azkkc-tests" /data/local/tmp/
          adb shell 'cd /data/local/tmp/azkkc-tests && LD_LIBRARY_PATH=. ./AzooKeyKanaKanjiConverterPackageTests.xctest'
          EOF
          chmod +x "$RUNNER_TEMP/run-android-tests.sh"

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests
        if: ${{ matrix.arch == 'x86_64' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          script: ${{ runner.temp }}/run-android-tests.sh
